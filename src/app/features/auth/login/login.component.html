<main class="pagina-auth">
  <form class="cartao" [formGroup]="formulario" (ngSubmit)="enviar()">
    <h1 class="cartao__titulo">Entrar</h1>

    <label class="campo">
      <span class="campo__rotulo">E-mail</span>
      <input class="campo__input" type="email" formControlName="email" autocomplete="email" />
      @if (formulario.controls.email.invalid && formulario.controls.email.touched) {
        <span class="campo__erro">informe um e-mail válido</span>
      }
    </label>

    <label class="campo">
      <span class="campo__rotulo">Senha</span>
      <input class="campo__input" type="password" formControlName="senha" autocomplete="current-password" />
    </label>

    @if (erro()) {
      <p class="cartao__erro">{{ erro() }}</p>
    }

    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'entrando...' : 'Entrar' }}
    </button>

    <p class="cartao__rodape">
      Ainda não tem conta? <a routerLink="/cadastro">Cadastre-se</a>
    </p>
  </form>
</main>
