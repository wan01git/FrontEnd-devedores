<main class="pagina-auth">
  <form class="cartao" [formGroup]="formulario" (ngSubmit)="enviar()">
    <h1 class="cartao__titulo">Criar conta</h1>

    <label class="campo">
      <span class="campo__rotulo">Nome</span>
      <input class="campo__input" type="text" formControlName="nome" autocomplete="name" />
      @if (formulario.controls.nome.touched && formulario.controls.nome.invalid) {
        <span class="campo__erro">
          {{ formulario.controls.nome.errors?.['servidor'] ?? 'informe seu nome' }}
        </span>
      }
    </label>

    <label class="campo">
      <span class="campo__rotulo">E-mail</span>
      <input class="campo__input" type="email" formControlName="email" autocomplete="email" />
      @if (formulario.controls.email.touched && formulario.controls.email.invalid) {
        <span class="campo__erro">
          {{ formulario.controls.email.errors?.['servidor'] ?? 'informe um e-mail válido' }}
        </span>
      }
    </label>

    <label class="campo">
      <span class="campo__rotulo">Senha</span>
      <input class="campo__input" type="password" formControlName="senha" autocomplete="new-password" />
      @if (formulario.controls.senha.touched && formulario.controls.senha.invalid) {
        <span class="campo__erro">
          {{ formulario.controls.senha.errors?.['servidor'] ?? 'mínimo de 8 caracteres' }}
        </span>
      }
    </label>

    @if (erroGeral()) {
      <p class="cartao__erro">{{ erroGeral() }}</p>
    }

    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'criando conta...' : 'Criar conta' }}
    </button>

    <p class="cartao__rodape">
      Já tem conta? <a routerLink="/login">Entrar</a>
    </p>
  </form>
</main>
